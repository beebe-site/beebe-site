<x-dc>
<helmet>
<title>Jackson Beebe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Director. Los Angeles.">
<meta property="og:title" content="Jackson Beebe">
<meta property="og:description" content="Director. Los Angeles.">
<meta property="og:site_name" content="Jackson Beebe">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jacksonbeebe.com">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Jackson Beebe">
<meta name="twitter:description" content="Director. Los Angeles.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDE9F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16112A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --jb-bg: #EDE9F2; --jb-card: #FAF8FD; --jb-ink: #2B1D4E; --jb-muted: #7C7095;
    --jb-line: rgba(43,29,78,0.16); --jb-dot: rgba(43,29,78,0.28);
    --jb-p-filter: none; --jb-p-filter-hover: invert(1);
    --jb-cardw: min(760px, 66vw, calc((100vh - 350px) * 1.3333));
    --jb-arrow: 54px; --jb-gap: 26px; --jb-pad: 24px;
    --jb-arrow-display: flex; --jb-swipe-display: none;
    --jb-sh-front: 0 -7px 16px -12px rgba(18,14,38,0.55), 0 1px 2px rgba(18,14,38,0.16), 0 26px 50px -20px rgba(30,26,16,0.45);
    --jb-sh-back: 0 -5px 12px -10px rgba(18,14,38,0.42), 0 14px 30px -18px rgba(30,26,16,0.4);
    --jb-accent: #5B3BD1; --jb-name-glow: none;
  }

  /* Neon tube: mostly lit, with brief stutters. Dark scheme + accent on only. */
  @keyframes jb-neon {
    0%, 12%, 14.4%, 16.2%, 43%, 44.6%, 47%, 100% {
      opacity: 1;
      text-shadow: 0 0 4px rgba(var(--jb-neon-hi),0.9), 0 0 12px rgba(var(--jb-neon),0.65), 0 0 34px rgba(var(--jb-neon),0.45), 0 0 68px rgba(var(--jb-neon),0.28);
    }
    13.2%, 45.6% { opacity: 0.32; text-shadow: 0 0 3px rgba(var(--jb-neon-hi),0.35); }
    15.3%, 46.2% { opacity: 0.62; text-shadow: 0 0 4px rgba(var(--jb-neon-hi),0.5), 0 0 14px rgba(var(--jb-neon),0.3); }
    73%, 73.9%, 75.4% { opacity: 1; text-shadow: 0 0 5px rgba(var(--jb-neon-hi),0.95), 0 0 16px rgba(var(--jb-neon),0.75), 0 0 42px rgba(var(--jb-neon),0.5); }
    73.5%, 74.7% { opacity: 0.24; text-shadow: none; }
  }
  @media (prefers-color-scheme: dark) {
    [data-accent="flicker"] .jb-name { animation: jb-neon 7.5s linear infinite; }
  }

  @media (max-width: 760px) {
    :root {
      --jb-cardw: min(560px, calc(100vw - 28px), calc((100vh - 255px) * 1.3333));
      --jb-arrow: 0px; --jb-gap: 0px; --jb-pad: 12px;
      --jb-arrow-display: none; --jb-swipe-display: flex;
    }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --jb-bg: #16112A; --jb-card: #211A3C; --jb-ink: #EDE7F8; --jb-muted: #9287B4;
      --jb-line: rgba(237,231,248,0.18); --jb-dot: rgba(237,231,248,0.32);
      --jb-p-filter: invert(1); --jb-p-filter-hover: none;
      --jb-sh-front: 0 0 0 1px rgba(237,231,248,0.16), 0 -8px 18px -12px rgba(0,0,0,0.7), 0 3px 6px rgba(0,0,0,0.45), 0 34px 60px -22px rgba(0,0,0,0.9);
      --jb-sh-back: 0 0 0 1px rgba(237,231,248,0.11), 0 -6px 14px -12px rgba(0,0,0,0.6), 0 20px 40px -16px rgba(0,0,0,0.85);
      --jb-accent: #BCA1FF; --jb-name-glow: 0 0 30px rgba(150,116,255,0.42); --jb-neon: 150,116,255; --jb-neon-hi: 226,214,255; --jb-neon-lit: #E4DBFF; --jb-neon-dead: #6F62A6;
    }
  }
  [data-theme="paper"] {
    --jb-accent: #B24A2C;
    --jb-bg: #EFEDE5; --jb-card: #FBFAF5; --jb-ink: #17150F; --jb-muted: #8A8271;
    --jb-line: rgba(23,21,15,0.14); --jb-dot: rgba(23,21,15,0.28);
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="paper"] {
      --jb-accent: #FF9E74; --jb-name-glow: 0 0 30px rgba(255,140,90,0.35); --jb-neon: 255,140,90; --jb-neon-hi: 255,214,193; --jb-neon-lit: #FFD2BB; --jb-neon-dead: #A5674B;
      --jb-bg: #15140F; --jb-card: #1F1D18; --jb-ink: #F2EFE6; --jb-muted: #948C7C;
      --jb-line: rgba(242,239,230,0.16); --jb-dot: rgba(242,239,230,0.3);
    }
  }
  html[data-accent="off"] { --jb-accent: var(--jb-ink); --jb-name-glow: none; }
  html { background: var(--jb-bg); }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--jb-bg); }
  body { min-height: 100vh; min-height: 100dvh; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: inherit; }
  * { box-sizing: border-box; }
</style>
</helmet>
<div data-theme="{{ theme }}" style="min-height: 100vh; min-height: 100dvh; width: 100%; background: var(--jb-bg); display: flex; flex-direction: column; align-items: center; font-family: Archivo, Helvetica, Arial, sans-serif; padding: calc(22px + env(safe-area-inset-top)) calc(var(--jb-pad) + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(var(--jb-pad) + env(safe-area-inset-left)); overflow-x: hidden;">

  <div role="button" tabindex="0" aria-label="{{ gridLabel }}" onClick="{{ toggleGrid }}" style="{{ gridBtnStyle }}" style-hover="border-color: var(--jb-ink); color: var(--jb-ink);">
    <sc-if value="{{ notGrid }}" hint-placeholder-val="{{ true }}">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.6"></rect><rect x="10.5" y="1" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.6"></rect><rect x="1" y="10.5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.6"></rect><rect x="10.5" y="10.5" width="6.5" height="6.5" stroke="currentColor" stroke-width="1.6"></rect></svg>
    </sc-if>
    <sc-if value="{{ grid }}" hint-placeholder-val="{{ false }}">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="4.5" y="2" width="11" height="8.5" stroke="currentColor" stroke-width="1.6"></rect><path d="M2.5 5.5v9.5h11" stroke="currentColor" stroke-width="1.6"></path></svg>
    </sc-if>
  </div>

  <header style="{{ headerStyle }}">
    <div style="{{ reelWrapStyle }}">
      <a href="{{ reelUrl }}" target="_blank" rel="noopener" onClick="{{ openReel }}" style="display: flex; align-items: center; gap: 9px; padding: 8px 14px; border: 1.5px solid var(--jb-ink); color: var(--jb-ink); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;" style-hover="background: var(--jb-ink); color: var(--jb-card);">
        Reel
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3v10h10v-3M9.5 2.5H14v4.5M14 2.5L7.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"></path></svg>
      </a>
    </div>
    <div style="{{ swipeHintStyle }}">
      Swipe
      <svg width="13" height="10" viewBox="0 0 13 10" fill="none" aria-hidden="true"><path d="M2 1l8 4-8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"></path></svg>
    </div>
  </header>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 0 6px;">
    <div ref="{{ availRef }}" style="display: flex; align-items: center; gap: var(--jb-gap); width: 100%; max-width: 1180px; justify-content: center;">
      <div ref="{{ cardProbeRef }}" aria-hidden="true" style="position: absolute; width: var(--jb-cardw); height: 0; visibility: hidden; pointer-events: none;"></div>

      <div role="button" tabindex="0" aria-label="Previous card" onClick="{{ prev }}" style="{{ prevArrowStyle }}" style-hover="opacity: 1; transform: translateY(2px); box-shadow: 0 1px 0 var(--jb-ink);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H5M5 12l6-6M5 12l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="square"></path></svg>
      </div>

      <div style="{{ deckStyle }}">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="1">
          <div style="{{ c.style }}">
            <div style="{{ c.flipStyle }}">

              <div onClick="{{ c.tapFlip }}" style="{{ c.frontFaceStyle }}">

                <sc-if value="{{ c.hasInfo }}" hint-placeholder-val="{{ true }}">
                  <div role="button" tabindex="0" aria-label="More information" onClick="{{ c.flip }}" style="{{ c.infoBtnStyle }}" style-hover="color: var(--jb-ink); transform: scale(1.08);">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10.3" stroke="currentColor" stroke-width="1.5"></circle><circle cx="12" cy="7.2" r="1.45" fill="currentColor"></circle><path d="M12 10.7v6.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt"></path></svg>
                  </div>
                </sc-if>

                <sc-if value="{{ c.isName }}" hint-placeholder-val="{{ true }}">
                  <div style="height: 100%; display: grid; grid-template-columns: 42% 1fr; gap: 6%; align-items: center; padding: 6%;">
                    <img src="{{ headshot }}" alt="Jackson Beebe" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: var(--jb-ink);">
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                      <h1 style="margin: 0; font-size: clamp(28px, 5.4vw, 50px); line-height: 1.05; font-weight: 500; letter-spacing: -0.02em; color: var(--jb-accent); text-shadow: var(--jb-name-glow);" class="jb-name">Jackson<br>Beebe</h1>
                      <p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: clamp(10px, 2.6vw, 12px); letter-spacing: 0.24em; text-transform: uppercase; color: var(--jb-muted);">Director</p>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{ c.isReel }}" hint-placeholder-val="{{ false }}">
                  <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 5.5%;">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none;">
                      <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: clamp(11px, 2.8vw, 14px); font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--jb-ink);">Reel</h2>
                      <div style="width: 64px; height: 2px; background: var(--jb-ink);"></div>
                    </div>
                    <div style="{{ reelBoxStyle }}">
                      <iframe src="{{ reelEmbed }}" title="Jackson Beebe directing reel" allow="autoplay; fullscreen; picture-in-picture" allowFullScreen="{{ true }}" frameBorder="0" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; border: 0;"></iframe>
                    </div>
                  </div>
                </sc-if>

                <sc-if value="{{ c.isWork }}" hint-placeholder-val="{{ false }}">
                  <div style="height: 100%; display: flex; flex-direction: column; padding: 4.5% 5.5% 5%;">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none;">
                      <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: clamp(11px, 2.8vw, 14px); font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--jb-ink);">Work</h2>
                      <div style="width: 64px; height: 2px; background: var(--jb-ink);"></div>
                    </div>
                    <div style="position: relative; flex: 1; min-height: 0; margin-top: 3.5%;">
                      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
                        <a href="{{ c.link }}" target="_blank" rel="noopener" onClick="{{ c.openStill }}" onMouseEnter="{{ c.onEnter }}" onMouseLeave="{{ c.onLeave }}" style="display: contents;">
                          <img src="{{ c.still }}" alt="{{ c.alt }}" style="{{ c.stillStyle }}">
                        </a>
                        <div style="{{ c.overlayStyle }}">
                            <span style="display: flex; align-items: center; gap: 9px; padding: 10px 16px; background: rgba(12,10,20,0.88); color: #F4F1FA; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">
                              Watch
                              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3v10h10v-3M9.5 2.5H14v4.5M14 2.5L7.5 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"></path></svg>
                            </span>
                        </div>
                      </div>
                    </div>
                    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-top: 2.8%;">
                      <span style="font-size: clamp(16px, 4.4vw, 21px); font-weight: 500; letter-spacing: -0.01em; color: var(--jb-ink);">{{ c.title }}</span>
                      <span style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(10px, 2.5vw, 11px); line-height: 1.5; letter-spacing: 0.1em; text-transform: uppercase; color: var(--jb-muted); text-align: right; text-wrap: pretty;">{{ c.meta }}<sc-if value="{{ c.pw }}" hint-placeholder-val="{{ false }}"><span style="text-transform: none; letter-spacing: 0.02em; color: inherit; border-bottom: 1px solid var(--jb-line); padding-bottom: 1px; white-space: nowrap;">{{ c.pw }}</span></sc-if></span>
                    </div>
                  </div>
                </sc-if>

              </div>

              <sc-if value="{{ c.hasInfo }}" hint-placeholder-val="{{ true }}">
                <div onClick="{{ c.flip }}" style="position: absolute; inset: 0; background: var(--jb-card); border-radius: 3px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg) translateZ(0.6px); -webkit-transform: rotateY(180deg) translateZ(0.6px); cursor: pointer;">
                  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4.5% 6% 5%;">
                    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex: none; padding-bottom: 2.6%; border-bottom: 1px solid var(--jb-line);">
                      <span style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(11px, 2.8vw, 13px); font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--jb-muted);">{{ c.backLabel }}</span>
                      <div role="button" tabindex="0" aria-label="Back to the front of the card" onClick="{{ c.flip }}" style="{{ c.closeBtnStyle }}" style-hover="color: var(--jb-ink);">
                        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="square"></path></svg>
                      </div>
                    </div>
                    <div style="position: relative; flex: 1; min-height: 0; margin-top: 3.2%;">
                      <div style="height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--jb-dot) transparent; padding-bottom: 2px;">
                        <sc-for list="{{ c.paras }}" as="p" hint-placeholder-count="2">
                          <p style="margin: 0 0 0.62em; font-size: clamp(13.5px, 3.5vw, 17px); line-height: 1.45; font-weight: 400; color: var(--jb-ink); text-wrap: pretty;">
                            <sc-for list="{{ p.runs }}" as="r" hint-placeholder-count="1"><sc-if value="{{ r.bold }}" hint-placeholder-val="{{ false }}"><strong style="font-weight: 600; color: var(--jb-ink);">{{ r.t }}</strong></sc-if><sc-if value="{{ r.plain }}" hint-placeholder-val="{{ true }}"><span>{{ r.t }}</span></sc-if></sc-for>
                          </p>
                        </sc-for>
                      </div>
                      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: linear-gradient(to bottom, transparent, var(--jb-card)); pointer-events: none;"></div>
                    </div>
                  </div>
                </div>
              </sc-if>

            </div>
          </div>
        </sc-for>
      </div>

      <div role="button" tabindex="0" aria-label="{{ nextLabel }}" onClick="{{ next }}" style="{{ nextArrowStyle }}" style-hover="opacity: 1; transform: translateY(2px); box-shadow: 0 1px 0 var(--jb-ink);">
        <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15M19 12l-6-6M19 12l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="square"></path></svg>
        </sc-if>
        <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h12a4 4 0 0 1 0 8H8" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"></path><path d="M11 13l-3 3 3 3" stroke="currentColor" stroke-width="2" stroke-linecap="square"></path></svg>
        </sc-if>
      </div>

    </div>
  </div>

  <div style="{{ dotsRowStyle }}">
    <sc-if value="{{ abacus }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 2px; right: 2px; top: 50%; height: 1.5px; margin-top: -0.75px; background: var(--jb-dot); opacity: 0.55; border-radius: 1px;"></div>
    </sc-if>
    <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
      <div role="button" aria-label="{{ d.label }}" onClick="{{ d.go }}" style="{{ d.style }}"></div>
    </sc-for>
    <sc-if value="{{ magnifier }}" hint-placeholder-val="{{ false }}">
      <div style="{{ lensStyle }}">
        <div style="{{ lensHandleStyle }}"></div>
      </div>
    </sc-if>
  </div>

  <footer style="display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--jb-line); width: var(--jb-cardw);" data-comment-anchor="5445cba144-footer">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--jb-muted); margin-right: 4px;">Contact:</span>
    <a href="https://instagram.com/whosbeebe" target="_blank" rel="noopener" onClick="{{ openInstagram }}" aria-label="Instagram @whosbeebe" style="display: flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 46px; border: 1.5px solid var(--jb-accent); color: var(--jb-accent);" style-hover="background: var(--jb-accent); color: var(--jb-card);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"></rect><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"></circle><circle cx="17.3" cy="6.7" r="1.3" fill="currentColor"></circle></svg>
    </a>
    <a href="https://www.linkedin.com/in/jackson-beebe/" target="_blank" rel="noopener" onClick="{{ openLinkedIn }}" aria-label="LinkedIn" style="display: flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 46px; border: 1.5px solid var(--jb-accent); color: var(--jb-accent);" style-hover="background: var(--jb-accent); color: var(--jb-card);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" stroke="currentColor" stroke-width="2"></rect><path d="M7.4 10.2v7.1M7.4 7.1v0.05" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path><path d="M11.6 17.3v-7.1M11.6 13.1c0-1.7 1.1-2.9 2.6-2.9s2.4 1.1 2.4 2.9v4.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <a href="mailto:beebe@capital-p.com" aria-label="Email beebe@capital-p.com" style="display: flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 46px; border: 1.5px solid var(--jb-accent); color: var(--jb-accent);" style-hover="background: var(--jb-accent); color: var(--jb-card);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" stroke="currentColor" stroke-width="2"></rect><path d="M3.6 6l8.4 7 8.4-7" stroke="currentColor" stroke-width="2"></path></svg>

        backLabel: f.title, back: f.back,
        stillStyle: { maxWidth: '100%', maxHeight: '100%', width: 'auto', height: 'auto', objectFit: 'contain', display: 'block', cursor: 'pointer', transition: 'transform .8s ease, filter .28s ease', transform: hovered ? 'scale(1.02)' : 'scale(1)', filter: hovered ? 'brightness(0.74)' : 'brightness(1)' },
        overlayStyle: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: hovered ? 1 : 0, transition: 'opacity .28s ease', pointerEvents: 'none' },
        open: this.open(f.link),
        openStill: (e) => { if (e) e.stopPropagation(); return this.open(f.link)(e); },
        onEnter: () => this.setState({ hover: idx }),
        onLeave: () => this.setState({ hover: -1 })
      });
    });
    const N = cards.length;
    cards.forEach((c, n) => {
      c.paras = (c.back || '').split('\n\n').filter(Boolean).map(t => ({ runs: this.runs(t) }));
      c.style = this.cardStyle(n, i, N, fly);
      const front = this.state.grid || ((n - i + N) % N) === 0;
      // The shadow rides on the flipping element so it turns with the card.
      const flipped = this.state.flipped === n;
      const infoDown = n === i && this.state.pressed === 'info';
      const closeDown = n === i && this.state.pressed === 'close';
      c.infoBtnStyle = {
        position: 'absolute', top: '3.2%', right: '3.2%', zIndex: 6,
        width: '34px', height: '34px', display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', color: infoDown ? 'var(--jb-ink)' : 'var(--jb-muted)',
        transform: infoDown ? 'scale(1.14)' : 'scale(1)',
        opacity: flipped ? 0 : 1,
        visibility: flipped ? 'hidden' : 'visible',
        pointerEvents: flipped ? 'none' : 'auto',
        transition: 'color .2s ease, transform .14s ease, opacity .2s ease ' + (flipped ? '.12s' : '0s') + ', visibility 0s linear ' + (flipped ? '.32s' : '0s')
      };
      c.closeBtnStyle = {
        width: '30px', height: '30px', margin: '-6px -4px 0 0',
        display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none',
        cursor: 'pointer', color: closeDown ? 'var(--jb-ink)' : 'var(--jb-muted)',
        transform: closeDown ? 'scale(1.14)' : 'scale(1)',
        transition: 'color .2s ease, transform .14s ease'
      };
      c.flipStyle = {
        position: 'absolute', inset: 0, transformStyle: 'preserve-3d', WebkitTransformStyle: 'preserve-3d', borderRadius: '3px',
        boxShadow: front ? 'var(--jb-sh-front)' : 'var(--jb-sh-back)',
        transform: this.state.flipped === n ? 'rotateY(180deg)' : 'rotateY(0deg)',
        transition: 'transform .72s cubic-bezier(.3,.9,.28,1), box-shadow .5s ease'
      };
      c.flip = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState(s => ({ flipped: s.flipped === n ? -1 : n })); };
      c.frontFaceStyle = {
        position: 'absolute', inset: 0, background: 'var(--jb-card)', borderRadius: '3px',
        overflow: 'hidden', backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden',
        transform: 'translateZ(0.6px)', WebkitTransform: 'translateZ(0.6px)',
        cursor: c.hasInfo ? 'pointer' : 'default'
      };
      // The whole card face is the info target — no aiming at the small "i".
      // A tap that followed a swipe, or that landed on the still, is ignored.
      c.tapFlip = c.hasInfo ? ((e) => {
        if (Date.now() - (this.lastSwipeT || 0) < 400) return;
        if (this.state.drag != null) return;
        this.setState(s => ({ flipped: s.flipped === n ? -1 : n }));
      }) : null;
    });

    const mode = this.props.indicator ?? 'Abacus';
    const magnifier = mode === 'Magnifying glass';
    const dial = mode === 'Circle dial';
    const abacus = mode === 'Abacus';
    const gap = magnifier ? 14 : 9;
    const dotW = 7;

    let dots, dotsRowStyle;
    if (abacus) {
      // A bare rod of round beads: everything already seen is slid to the left end,
      // what is still to come waits at the right, and the bead in play stretches out
      // to the middle of the rack.
      const rackW = 200, mid = rackW / 2, pack = 9, r = 3.5, endPad = 6;
      dots = cards.map((c, n) => {
        const active = n === i;
        const w = active ? 22 : 7, h = 7;
        let x;
        if (active) x = mid;
        else if (n < i) x = endPad + r + n * pack;                    // used: packed left
        else x = rackW - endPad - r - (N - 1 - n) * pack;              // waiting: packed right
        return {
          label: 'Go to card ' + (n + 1),
          go: () => this.jump(n),
          style: {
            position: 'absolute', top: '50%', left: (x - w / 2) + 'px',
            width: w + 'px', height: h + 'px', marginTop: -(h / 2) + 'px',
            borderRadius: '4px', zIndex: active ? 3 : 2,
            background: active ? 'var(--jb-ink)' : 'var(--jb-dot)',
            cursor: 'pointer',
            transition: 'left .5s cubic-bezier(.3,.9,.25,1), width .4s cubic-bezier(.3,.9,.25,1), background .35s ease'
          }
        };
      });
      dotsRowStyle = { position: 'relative', width: rackW + 'px', height: '26px', margin: '26px 0 4px', flex: 'none' };
    } else if (dial) {
      // Card 1 sits at twelve o'clock; the bold mark tracks clockwise like a clock hand.
      const R = 23, cx = 36, cy = 36;
      dots = cards.map((c, n) => {
        const active = n === i;
        const deg = -90 + n * (360 / N);
        const th = deg * Math.PI / 180;
        const w = active ? 6.5 : 4.5, h = active ? 13 : 8;
        const x = cx + R * Math.cos(th), y = cy + R * Math.sin(th);
        return {
          label: 'Go to card ' + (n + 1),
          go: () => this.jump(n),
          style: {
            position: 'absolute', left: (x - w / 2) + 'px', top: (y - h / 2) + 'px',
            width: w + 'px', height: h + 'px', borderRadius: '50%',
            background: active ? 'var(--jb-ink)' : 'var(--jb-dot)',
            transform: `rotate(${deg + 90}deg)`,
            cursor: 'pointer',
            transition: 'left .45s cubic-bezier(.22,.85,.28,1), top .45s cubic-bezier(.22,.85,.28,1), width .35s ease, height .35s ease, background .35s ease'
          }
        };
      });
      dotsRowStyle = { position: 'relative', width: '72px', height: '72px', margin: '24px 0 4px', flex: 'none' };
    } else {
      dots = cards.map((c, n) => ({
        label: 'Go to card ' + (n + 1),
        go: () => this.jump(n),
        style: magnifier ? {
          width: dotW + 'px', height: dotW + 'px', borderRadius: '50%', flex: 'none',
          background: n === i ? 'var(--jb-ink)' : 'var(--jb-dot)',
          transform: n === i ? 'scale(2.15, 1.5)' : (Math.abs(n - i) === 1 ? 'scale(1.2, 1.05)' : 'scale(1)'),
          cursor: 'pointer', transition: 'transform .35s cubic-bezier(.22,.85,.28,1), background .35s ease'
        } : {
          width: n === i ? '22px' : '7px', height: '7px', borderRadius: '4px',
          background: n === i ? 'var(--jb-ink)' : 'var(--jb-dot)',
          cursor: 'pointer', transition: 'width .35s ease, background .35s ease'
        }
      }));
      dotsRowStyle = { position: 'relative', display: 'flex', alignItems: 'center', gap: gap + 'px', margin: '26px 0 4px', height: '26px', flex: 'none' };
    }

    const pitch = dotW + gap;
    const lensD = 26;
    const grid = !!this.state.grid;
    if (grid) dotsRowStyle = Object.assign({}, dotsRowStyle, { display: 'none' });

    return {
      reelBoxStyle: {
        position: 'relative', flex: '1 1 auto', minHeight: 0, height: '100%', maxWidth: '100%', maxHeight: '100%',
        aspectRatio: String(this.state.reelRatio || 16 / 9),
        margin: '0 auto', background: '#000',
        boxShadow: '0 0 0 1px rgba(0,0,0,0.5), 0 0 18px 6px rgba(0,0,0,0.34), 0 0 46px 18px rgba(0,0,0,0.2)'
      },
      grid, notGrid: !grid,
      toggleGrid: () => {
        this.clearFly();
        this.setState(s => ({ grid: !s.grid, settling: true, flipped: -1, hover: -1, fly: null, drag: null }));
        clearTimeout(this.settleT);
        this.settleT = setTimeout(() => this.setState({ settling: false }), 900);
      },
      gridLabel: grid ? 'Stack the cards back up' : 'View all cards in a grid',
      gridBtnStyle: {
        position: 'fixed', top: 'calc(16px + env(safe-area-inset-top))', right: 'calc(16px + env(safe-area-inset-right))',
        zIndex: 800, width: '40px', height: '40px', display: 'flex', alignItems: 'center', justifyContent: 'center',
        border: '1.5px solid var(--jb-line)', borderRadius: '3px', cursor: 'pointer',
        background: 'transparent', color: grid ? 'var(--jb-ink)' : 'var(--jb-muted)',
        transition: 'background .25s ease, color .25s ease, border-color .25s ease'
      },
      availRef: this.availRef,
      cardProbeRef: this.cardProbeRef,
      deckStyle: (() => {
        const { g, availW, cellW, cellH, cardW } = this.geo();
        const rows = Math.ceil(N / 3);
        const shared = { position: 'relative', flex: 'none', touchAction: 'pan-y', transition: 'width .62s cubic-bezier(.22,.85,.28,1), height .62s cubic-bezier(.22,.85,.28,1)' };
        if (grid) {
          return Object.assign({}, shared, availW
            ? { width: availW + 'px', height: (rows * cellH + (rows - 1) * g) + 'px' }
            : { width: '100%', aspectRatio: '1 / 1' });
        }
        return Object.assign({}, shared, cardW
          ? { width: cardW + 'px', height: (cardW * 0.75) + 'px' }
          : { width: 'var(--jb-cardw)', aspectRatio: '4 / 3' });
      })(),
      cards, dots, reelUrl, reelEmbed: this.embedUrl(reelUrl), magnifier, abacus, dotsRowStyle,
      lensStyle: {
        position: 'absolute', top: '50%', left: 0, width: lensD + 'px', height: lensD + 'px',
        marginTop: -(lensD / 2) + 'px', borderRadius: '50%',
        border: '1.5px solid var(--jb-ink)', background: 'transparent',
        transform: `translateX(${dotW / 2 + i * pitch - lensD / 2 - 1.5}px)`,
        transition: 'transform .45s cubic-bezier(.22,.85,.28,1)',
        pointerEvents: 'none', opacity: 0.85
      },
      lensHandleStyle: {
        position: 'absolute', right: '-5px', bottom: '-1px', width: '9px', height: '1.5px',
        background: 'var(--jb-ink)', transform: 'rotate(45deg)', transformOrigin: 'left center', borderRadius: '1px'
      },
      theme: (this.props.palette ?? 'Royal purple') === 'Royal purple' ? 'royal' : 'paper',
      headshot: encodeURI('img/me headshot.jpg'),
      pIcon: 'img/p-icon.png',
      openReel: this.open(reelUrl),
      openInstagram: this.open('https://instagram.com/whosbeebe'),
      openLinkedIn: this.open('https://www.linkedin.com/in/jackson-beebe/'),
      openCapitalP: this.open('https://capital-p.com'),
      headerStyle: {
        position: 'relative',
        display: 'flex', justifyContent: 'center', alignItems: 'flex-start',
        width: 'var(--jb-cardw)', height: '58px', paddingBottom: '15px',
        borderBottom: '1px solid var(--jb-line)',
        opacity: (i >= 2 || (this.state.mobile && i === 0)) ? 1 : 0,
        transform: (i >= 2 || (this.state.mobile && i === 0)) ? 'translateY(0)' : 'translateY(-8px)',
        pointerEvents: i >= 2 ? 'auto' : 'none',
        transition: 'opacity .4s ease, transform .4s ease'
      },
      reelWrapStyle: {
        display: 'flex', justifyContent: 'center',
        opacity: i >= 2 ? 1 : 0,
        pointerEvents: i >= 2 ? 'auto' : 'none',
        transition: 'opacity .35s ease'
      },
      swipeHintStyle: {
        position: 'absolute', top: '11px', left: '50%', transform: 'translateX(-50%)',
        display: 'var(--jb-swipe-display)', alignItems: 'center', gap: '11px',
        color: 'var(--jb-muted)', fontFamily: "'IBM Plex Mono', monospace",
        fontSize: '10px', letterSpacing: '0.3em', textTransform: 'uppercase',
        whiteSpace: 'nowrap', userSelect: 'none', pointerEvents: 'none',
        opacity: i === 0 ? 1 : 0,
        transition: 'opacity .35s ease'
      },
      prev: () => this.go(-1),
      next: () => this.go(1, true),
      nextLabel: i >= N - 1 ? 'Start over from the first card' : 'Next card',
      isLast: i >= N - 1,
      notLast: i < N - 1,
      prevArrowStyle: grid ? { display: 'none' } : this.arrow(i > 0, this.state.pressed === 'left'),
      nextArrowStyle: grid ? { display: 'none' } : this.arrow(true, this.state.pressed === 'right')
    };
  }
}
</script>
